<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">

    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-blue-600/10 border border-blue-500/30 flex items-center justify-center mx-auto mb-4 text-blue-400 shadow-inner">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-xl font-extrabold text-white">لوحة إدارة النظام البيومتري</h1>
            <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">
                يرجى إدخال كلمة مرور مدير النظام للوصول وإدارة الموظفين والصلاحيات
            </p>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">كلمة مرور الإدارة</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="adminPasswordInput" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition dir-ltr text-center font-mono placeholder:text-slate-500"
                    >
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute left-3 top-3 text-slate-400 hover:text-slate-200 text-xs">
                        👁️
                    </button>
                </div>
                <p class="text-[11px] text-slate-500 mt-1.5 text-right">
                    كلمة المرور الافتراضية للنظام هي: <span class="font-mono text-blue-400 font-bold">admin123</span> (يمكن تغييرها من الإعدادات).
                </p>
            </div>

            <!-- Error Notice -->
            <div id="loginErrorMsg" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-300 font-semibold text-center">
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="btnLoginSubmit"
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition duration-200 shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2"
            >
                <span>تسجيل الدخول إلى لوحة الإدارة</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>

        <!-- Back to Attendance Kiosk -->
        <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-slate-200 transition inline-flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>العودة لشاشة تسجيل الحضور والانصراف</span>
            </a>
        </div>

    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById("adminPasswordInput");
            input.type = input.type === "password" ? "text" : "password";
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLoginSubmit");
            const errBox = document.getElementById("loginErrorMsg");
            const password = document.getElementById("adminPasswordInput").value;

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin mr-2">⏳</span> جاري التحقق...`;
            errBox.classList.add("hidden");

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = data.redirect || "/admin";
                } else {
                    errBox.innerText = data.detail || "كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى.";
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = "تعذر الاتصال بالخادم، يرجى التأكد من تشغيل النظام.";
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>تسجيل الدخول إلى لوحة الإدارة</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
            }
        }
    </script>
</body>
</html>
