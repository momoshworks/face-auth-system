<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم رفض الوصول | البوابة المحمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/90 border border-red-500/30 rounded-2xl p-8 text-center shadow-2xl backdrop-blur-md">
        <div class="w-20 h-20 bg-red-500/10 border-2 border-red-500/40 rounded-full flex items-center justify-center mx-auto mb-6 text-red-400">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m4-11a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-red-400 mb-2">تم حظر الوصول (Access Denied)</h1>
        <p class="text-slate-300 text-sm mb-6 leading-relaxed">
            {{ reason }}
        </p>
        <div class="p-4 bg-slate-800/60 rounded-xl border border-slate-700/50 mb-6 text-right text-xs text-slate-400 space-y-1">
            <p>• هذا النظام محمي ولا يسمح بالدخول عبر الروابط المباشرة.</p>
            <p>• يتطلب الدخول مسح الوجه أمام الكاميرا والتحقق من الصلاحيات.</p>
        </div>
        <a href="/" class="block w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-blue-600/30">
            الانتقال إلى نظام مسح وبصمة الوجه
        </a>
    </div>
</body>
</html>
